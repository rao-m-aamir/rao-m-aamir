name: trail-record
on:
  schedule:
    - cron: '17 3 * * 1'      # weekly, Mondays 03:17 UTC
  workflow_dispatch:           # also lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild trail-record.svg
        run: python scripts/field_record.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trail-record.svg
          git diff --staged --quiet || (git commit -m "Update trail record" && git push)
