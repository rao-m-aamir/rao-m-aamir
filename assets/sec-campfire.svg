<svg xmlns="http://www.w3.org/2000/svg" width="900" height="48" viewBox="0 0 900 48" role="img" aria-label="06 The Campfire" shape-rendering="crispEdges"><style>
.blink{animation:blink 1.1s steps(1) infinite}
